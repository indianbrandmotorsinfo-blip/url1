upstream backend_api {
    server backend:8000;
}

upstream frontend_app {
    server frontend:8080;
}

# --- HTTP: redirect everything to HTTPS ------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name myurls.yashwanthgowdam.in;

    # Used by the Docker health check; must answer before the redirect.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name myurls.yashwanthgowdam.in;

    ssl_certificate     /etc/letsencrypt/live/myurls.yashwanthgowdam.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myurls.yashwanthgowdam.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Secure headers (kept at server level: add_header in a location would drop these).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Login: very strict rate limit against password guessing.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend_api;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend_api;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        proxy_pass http://frontend_app;
        include /etc/nginx/proxy_params.conf;
    }
}
